packages:
  - 'packages/*'
  - 'apps/*'

allowBuilds:
  esbuild: true
  msgpackr-extract: false # optional native accelerator; not required
  protobufjs: false # optional postinstall codegen; ships prebuilt dist
  unrs-resolver: true

# Link internal workspace packages referenced with plain "*" versions (npm-compatible,
# see docs/design.md §3) instead of the pnpm-exclusive workspace: protocol.
linkWorkspacePackages: true

onlyBuiltDependencies:
  - esbuild
