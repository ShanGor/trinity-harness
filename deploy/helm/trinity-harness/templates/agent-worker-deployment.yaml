apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trinity-harness.fullname" . }}-agent-worker
  labels:
    app.kubernetes.io/name: agent-worker
    {{- include "trinity-harness.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.agentWorker.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-worker
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-worker
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.agentWorker.runtimeClassName }}
      # Sandbox hardening (docs/design.md §12.3): gVisor runs the Loop's tool
      # executions with a guest-kernel boundary; the reserved upgrade path to
      # Firecracker microVMs keeps the same port surface.
      runtimeClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: agent-worker
          image: {{ include "trinity-harness.image" (dict "image" .Values.agentWorker.image "global" .Values.global) | quote }}
          imagePullPolicy: IfNotPresent
          {{- include "trinity-harness.envFrom" . | nindent 10 }}
          resources:
            {{- toYaml .Values.agentWorker.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: workspace, mountPath: {{ .Values.workspace.mountPath | quote }} }
          {{- include "trinity-harness.securityContext" . | nindent 10 }}
          # SIGTERM drain: BullMQ close() finishes the in-flight turn before
          # exit (docs/design.md §16); preStop gives the relay time to flush.
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
      terminationGracePeriodSeconds: 600
      volumes:
        - name: tmp
          emptyDir: {}
        - name: workspace
          {{- if .Values.workspace.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "trinity-harness.fullname" . }}-workspace
          {{- else }}
          emptyDir: {}
          {{- end }}
