apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trinity-harness.fullname" . }}-secret
  labels:
    {{- include "trinity-harness.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ required "secrets.redisUrl is required" .Values.secrets.redisUrl | quote }}
  TOKEN_SECRET: {{ required "secrets.tokenSecret is required" .Values.secrets.tokenSecret | quote }}
  ADMIN_EMAIL: {{ .Values.secrets.adminEmail | quote }}
  ADMIN_PASSWORD: {{ required "secrets.adminPassword is required" .Values.secrets.adminPassword | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  {{- if or .Values.secrets.webPushPublicKey .Values.secrets.webPushPrivateKey .Values.secrets.webPushSubject .Values.secrets.webPushAllowedOrigins }}
  WEB_PUSH_PUBLIC_KEY: {{ required "Web Push requires secrets.webPushPublicKey" .Values.secrets.webPushPublicKey | quote }}
  WEB_PUSH_PRIVATE_KEY: {{ required "Web Push requires secrets.webPushPrivateKey" .Values.secrets.webPushPrivateKey | quote }}
  WEB_PUSH_SUBJECT: {{ required "Web Push requires secrets.webPushSubject" .Values.secrets.webPushSubject | quote }}
  WEB_PUSH_ALLOWED_ORIGINS: {{ required "Web Push requires secrets.webPushAllowedOrigins" .Values.secrets.webPushAllowedOrigins | quote }}
  {{- end }}
  {{- if eq .Values.config.browserDriver "zendriver" }}
  BROWSER_RUNTIME_TOKEN: {{ required "Zendriver requires secrets.browserRuntimeToken" .Values.secrets.browserRuntimeToken | quote }}
  {{- end }}
  {{- if or .Values.secrets.nodeRuntimeToken (eq .Values.config.executionDriver "firecracker") }}
  NODE_RUNTIME_TOKEN: {{ required "Firecracker execution requires secrets.nodeRuntimeToken" .Values.secrets.nodeRuntimeToken | quote }}
  {{- end }}
  {{- if eq .Values.config.executionDriver "firecracker" }}
  FIRECRACKER_MAINTENANCE_TOKEN: {{ required "Firecracker execution requires secrets.firecrackerMaintenanceToken" .Values.secrets.firecrackerMaintenanceToken | quote }}
  {{- else if .Values.secrets.firecrackerMaintenanceToken }}
  FIRECRACKER_MAINTENANCE_TOKEN: {{ .Values.secrets.firecrackerMaintenanceToken | quote }}
  {{- end }}
