apiVersion: v1
kind: Secret
metadata:
  name: {{ include "trinity-harness.fullname" . }}-secret
  labels:
    {{- include "trinity-harness.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ required "secrets.databaseUrl is required" .Values.secrets.databaseUrl | quote }}
  REDIS_URL: {{ required "secrets.redisUrl is required" .Values.secrets.redisUrl | quote }}
  TOKEN_SECRET: {{ required "secrets.tokenSecret is required" .Values.secrets.tokenSecret | quote }}
  ADMIN_EMAIL: {{ .Values.secrets.adminEmail | quote }}
  ADMIN_PASSWORD: {{ required "secrets.adminPassword is required" .Values.secrets.adminPassword | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
