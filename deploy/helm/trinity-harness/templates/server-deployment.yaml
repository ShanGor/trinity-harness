apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trinity-harness.fullname" . }}-server
  labels:
    app.kubernetes.io/name: server
    {{- include "trinity-harness.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: server
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: server
          image: {{ include "trinity-harness.image" (dict "image" .Values.server.image "global" .Values.global) | quote }}
          imagePullPolicy: IfNotPresent
          {{- include "trinity-harness.envFrom" . | nindent 10 }}
          ports:
            - name: http
              containerPort: {{ .Values.server.service.port }}
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            periodSeconds: 15
            initialDelaySeconds: 10
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: workspace, mountPath: {{ .Values.workspace.mountPath | quote }} }
          {{- include "trinity-harness.securityContext" . | nindent 10 }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: workspace
          {{- if .Values.workspace.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "trinity-harness.fullname" . }}-workspace
          {{- else }}
          emptyDir: {}
          {{- end }}
