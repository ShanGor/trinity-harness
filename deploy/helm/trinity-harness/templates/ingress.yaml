{{- if .Values.ingress.enabled }}
# docs/design.md §16: TLS at the ingress, SSE buffering disabled (annotations),
# long timeouts for /acp/stream. The web service proxies /api + /acp to the
# server over the cluster; the ingress only fronts the web tier.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "trinity-harness.fullname" . }}
  labels:
    {{- include "trinity-harness.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "trinity-harness.fullname" . }}-web
                port:
                  name: http
{{- end }}
