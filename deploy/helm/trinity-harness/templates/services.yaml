apiVersion: v1
kind: Service
metadata:
  name: {{ include "trinity-harness.fullname" . }}-server
  labels:
    app.kubernetes.io/name: server
    {{- include "trinity-harness.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: server
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
---
{{- if .Values.web.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "trinity-harness.fullname" . }}-web
  labels:
    app.kubernetes.io/name: web
    {{- include "trinity-harness.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- end }}
