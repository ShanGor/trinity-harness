{{- if eq .Values.config.executionDriver "firecracker" }}
{{- if ne .Values.config.browserDriver "zendriver" }}
{{- fail "Firecracker execution requires config.browserDriver=zendriver" }}
{{- end }}
{{- $_ := required "Firecracker execution requires config.firecrackerNodes" .Values.config.firecrackerNodes }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trinity-harness.fullname" . }}-config
  labels:
    {{- include "trinity-harness.labels" . | nindent 4 }}
data:
  HOST: "0.0.0.0"
  EXECUTION_DRIVER: {{ .Values.config.executionDriver | quote }}
  BROWSER_DRIVER: {{ .Values.config.browserDriver | quote }}
  {{- if eq .Values.config.browserDriver "zendriver" }}
  BROWSER_RUNTIME_ENDPOINT: {{ required "Zendriver requires config.browserRuntimeEndpoint" .Values.config.browserRuntimeEndpoint | quote }}
  {{- end }}
  SCHEDULING_ENABLED: {{ .Values.controlWorker.enabled | quote }}
  {{- if .Values.config.firecrackerNodes }}
  FIRECRACKER_NODES: {{ .Values.config.firecrackerNodes | toJson | quote }}
  {{- end }}
  PORT: "3000"
  WORKSPACE_ROOT: {{ .Values.workspace.mountPath | quote }}
  MODEL: {{ .Values.config.model | quote }}
  {{- if .Values.config.systemPrompt }}
  SYSTEM_PROMPT: {{ .Values.config.systemPrompt | quote }}
  {{- end }}
  DEFAULT_PERMISSION_POLICY: {{ .Values.config.defaultPermissionPolicy | quote }}
  {{- if ne .Values.config.maxTurnSteps nil }}
  MAX_TURN_STEPS: {{ .Values.config.maxTurnSteps | quote }}
  {{- end }}
  MODEL_CONTEXT_TOKENS: {{ .Values.config.modelContextTokens | quote }}
  MODEL_OUTPUT_TOKENS: {{ .Values.config.modelOutputTokens | quote }}
  COMPACTION_CONTEXT_TOKENS: {{ .Values.config.compactionContextTokens | quote }}
  {{- if ne .Values.config.taskMaxToolCalls nil }}
  TASK_MAX_TOOL_CALLS: {{ .Values.config.taskMaxToolCalls | quote }}
  {{- end }}
  {{- if ne .Values.config.taskMaxRequests nil }}
  TASK_MAX_REQUESTS: {{ .Values.config.taskMaxRequests | quote }}
  {{- end }}
  {{- if ne .Values.config.taskMaxTokens nil }}
  TASK_MAX_TOKENS: {{ .Values.config.taskMaxTokens | quote }}
  {{- end }}
  {{- if ne .Values.config.taskMaxDurationMs nil }}
  TASK_MAX_DURATION_MS: {{ .Values.config.taskMaxDurationMs | quote }}
  {{- end }}
  {{- if .Values.config.taskMaxCost }}
  TASK_MAX_COST: {{ .Values.config.taskMaxCost | quote }}
  {{- end }}
  CONTEXT_MAX_TOKENS: {{ .Values.config.contextMaxTokens | quote }}
  CONTEXT_KEEP_TOKENS: {{ .Values.config.contextKeepTokens | quote }}
  SPILL_THRESHOLD_BYTES: {{ .Values.config.spillThresholdBytes | quote }}
  SANDBOX_ENV_MODE: {{ .Values.config.sandboxEnvMode | quote }}
  LSP_ENABLED: {{ .Values.agentWorker.lsp.enabled | quote }}
  LSP_MAX_SERVERS: {{ .Values.agentWorker.lsp.maxServers | quote }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otelExporterOtlpEndpoint | quote }}
  OTEL_PROMETHEUS_PORT: {{ .Values.config.otelPrometheusPort | quote }}
  ACP_SERVER_URL: {{ .Values.acpGateway.acpServerUrl | quote }}
